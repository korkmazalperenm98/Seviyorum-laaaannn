<!DOCTYPE html>
<html>
<head>
    <title>Sana Bir Mesajım Var ❤️</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; transition: all 0.3s; overflow: hidden; }
        button { background-color: #ff4d4d; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; transition: all 0.3s; margin-top: 20px; }
        #mesaj { font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div id="mesaj" style="font-size: 20px;">Seni Seviyorum!</div>
    <button id="btn" onclick="buyut()">Ben de seni seviyorum</button>

    <script>
        let fSize = 20;
        let btnPadding = 15;

        function buyut() {
            fSize += 15;
            btnPadding += 10;
            
            document.getElementById('mesaj').style.fontSize = fSize + "px";
            document.getElementById('btn').style.padding = btnPadding + "px " + (btnPadding*2) + "px";
            document.getElementById('btn').style.fontSize = (fSize / 2) + "px";
            
            if(fSize > 100) {
                document.body.style.backgroundColor = "#ffe6e6";
            }
        }
    </script>
</body>
</html>
